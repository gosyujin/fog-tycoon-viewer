name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build info and cache-bust assets
        run: |
          SHA="${GITHUB_SHA::7}"
          TIME="$(TZ='Asia/Tokyo' date +"%Y-%m-%d %H:%M:%S")"
          cat > build-info.js <<EOF
          window.BUILD_INFO = { sha: '${SHA}', time: '${TIME}' };
          EOF
          sed -i -e "s/build-info\.js\"><\/script>/build-info.js?v=${SHA}\"><\/script>/" \
                 -e "s/app\.js\"><\/script>/app.js?v=${SHA}\"><\/script>/" \
                 -e "s/href=\"style\.css\"/href=\"style.css?v=${SHA}\"/" index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
