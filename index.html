<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fog Tycoon</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<div id="ui" hidden>
  <button id="gear" class="fab" type="button" aria-label="設定" aria-expanded="false" aria-controls="panel">⚙</button>
  <button id="recallBtn" class="fab" type="button" aria-pressed="false" aria-label="この辺りの履歴 (押してから地図をタップ)" hidden>🕘</button>
  <div id="panel" hidden>
    <strong>Fog Tycoon</strong>
    <div id="stats">読み込み中…</div>
    <label><input type="checkbox" id="fog" checked> 霧</label>
    <label><input type="checkbox" id="tracks"> 軌跡</label>
    <label>霧の濃さ <input type="range" id="density" min="30" max="100" step="5" value="88"> <span id="dv">88</span>%</label>
    <label>晴れ半径 <input type="range" id="radius" min="20" max="300" value="80"> <span id="rv">80</span>m</label>
    <label>期間
      <select id="range">
        <option value="all">全期間</option>
        <option value="365">直近1年</option>
        <option value="30">直近30日</option>
        <option value="7">直近7日</option>
      </select>
    </label>
    <label>同期先 <input type="url" id="syncurl" placeholder="https://mini.xxxx.ts.net" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <button id="reload" type="button">再読み込み</button>
    <button id="logout" type="button">Dropbox の認可を解除</button>
  </div>
</div>

<div id="statbar"><span id="bt"></span></div>

<div id="legend" hidden aria-label="訪問日数の凡例">
  <span><i style="background:rgb(59,130,246)"></i>1日</span>
  <span><i style="background:rgb(34,197,94)"></i>2〜3日</span>
  <span><i style="background:rgb(250,204,21)"></i>4〜9日</span>
  <span><i style="background:rgb(239,68,68)"></i>10日〜</span>
</div>
<button id="sync" class="fab" type="button" aria-label="Dawarich と同期" hidden>🔄</button>
<div id="toast" role="status" hidden></div>
<form id="ciSheet" hidden autocomplete="off">
  <div class="rc-head"><strong>チェックイン</strong><button id="ciClose" type="button" aria-label="閉じる">×</button></div>
  <div id="ciDbg" style="font:10px/1.3 monospace;opacity:.6;word-break:break-all"></div>
  <div id="ciPos"></div>
  <div class="ci-row"><button type="button" id="ciHere">現在地</button><button type="button" id="ciPick">地図で指定</button></div>
  <label class="ci-time">時刻 <input id="ciTime" type="datetime-local"></label>
  <details id="ciStays"><summary id="ciStaySum">この日の滞在から選ぶ</summary><div id="ciStayList"></div></details>
  <div id="ciNear"></div>
  <input id="ciWhere" list="ciPlaces" placeholder="どこ? (店・施設など)" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" autocapitalize="off" required>
  <datalist id="ciPlaces"></datalist>
  <input id="ciNote" placeholder="メモ (任意)" enterkeyhint="done">
  <button type="submit" id="ciSave">チェックイン</button>
</form>
<button id="mode" class="fab" type="button" aria-pressed="false" aria-label="霧 (押すとヒートマップ)" hidden>🌫</button>
<button id="pinBtn" class="fab" type="button" aria-pressed="true" aria-label="チェックインのピンを出す/隠す" hidden>📍</button>
<div id="recall" hidden>
  <div class="rc-head"><strong id="rcTitle"></strong><button id="rcClose" type="button" aria-label="閉じる">×</button></div>
  <div id="rcRadii" role="group" aria-label="半径">
    <button type="button" data-r="50">50m</button><button type="button" data-r="100">100m</button><button type="button" data-r="200">200m</button><button type="button" data-r="500">500m</button>
  </div>
  <ul id="rcList"></ul>
</div>
<button id="live" class="fab" type="button" aria-label="現在地を追跡" aria-pressed="false" hidden>●</button>
<button id="ciBtn" class="fab" type="button" aria-label="チェックイン" hidden>✅</button>
<button id="locate" class="fab" type="button" aria-label="現在地 (長押しでコンパス)" aria-pressed="false" hidden>◎</button>

<div id="login" hidden>
  <div class="card">
    <strong>Fog Tycoon</strong>
    <p>Dropbox アプリの App key を入力して認可します。この端末の localStorage にだけ保存します。要求する権限は、アプリ専用フォルダ (App Folder) の中の読み書きだけです (読み: 軌跡データ / 書き: チェックイン)。</p>
    <p>このページの URL <code id="redir"></code> を、Dropbox アプリの Redirect URIs に登録してください。</p>
    <input id="key" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="App key">
    <button id="loginBtn" type="button">Dropbox で認可する</button>
    <p id="loginErr" class="err"></p>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<script src="build-info.js"></script>
<script src="app.js"></script>
</body>
</html>
